name: build-tach-xep-pdf-v2.6.1

on:
  push:
    branches:
      - build/tach-xep-pdf-v2.6.1-20260908
    paths:
      - 'tach-xep-pdf-v2.3.2/**'
      - '.github/workflows/build-tach-xep-pdf-v2.6.1.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reconstruct and build v2.6.1 isolated preview pan
        shell: pwsh
        run: |
          $b64 = ((Get-ChildItem 'tach-xep-pdf-v2.3.2/build.parts/*.part' | Sort-Object Name | ForEach-Object { Get-Content $_.FullName -Raw }) -join '')
          [IO.File]::WriteAllBytes('tach-xep-pdf-v2.3.2/build_v232.ps1.gz', [Convert]::FromBase64String($b64))
          gzip -d -f 'tach-xep-pdf-v2.3.2/build_v232.ps1.gz'
          python 'tach-xep-pdf-v2.3.2/patch_build_v232.py'
          if ($LASTEXITCODE -ne 0) { throw "patch_build_v232.py failed: $LASTEXITCODE" }
          python 'tach-xep-pdf-v2.3.2/prepare_build_v233.py'
          python 'tach-xep-pdf-v2.3.2/prepare_build_v234.py'
          python 'tach-xep-pdf-v2.3.2/prepare_build_v235.py'
          python 'tach-xep-pdf-v2.3.2/prepare_build_v235f.py'
          python 'tach-xep-pdf-v2.3.2/prepare_build_v240.py'
          python 'tach-xep-pdf-v2.3.2/prepare_build_v241.py'
          python 'tach-xep-pdf-v2.3.2/prepare_build_v242.py'
          python 'tach-xep-pdf-v2.3.2/prepare_build_v243.py'
          python 'tach-xep-pdf-v2.3.2/prepare_build_v244.py'
          python 'tach-xep-pdf-v2.3.2/prepare_build_v245.py'
          python 'tach-xep-pdf-v2.3.2/prepare_build_v250.py'
          python 'tach-xep-pdf-v2.3.2/prepare_build_v260.py'
          python 'tach-xep-pdf-v2.3.2/prepare_build_v261.py'
          if ($LASTEXITCODE -ne 0) { throw "prepare_build_v261.py failed: $LASTEXITCODE" }
          & pwsh -NoProfile -ExecutionPolicy Bypass -File 'tach-xep-pdf-v2.3.2/build_v232.ps1'
          if ($LASTEXITCODE -ne 0) { throw "Build script failed: $LASTEXITCODE" }

      - name: Final pan isolation and protected regression smoke
        shell: pwsh
        run: |
          $srcPath = 'tach-xep-pdf-v2.3.2/TachXepTrangPDF.cs'
          $src = Get-Content $srcPath -Raw
          $required = @(
            'AppVersion = "2.6.1"',
            'SmoothPreviewPanel',
            '_previewScroll.AutoScroll = true',
            'PreviewPanMouseDown',
            'PreviewPanMouseMove',
            'PreviewPanMouseUp',
            'SetPreviewPanPosition',
            'CanPanPreview',
            'Control.MousePosition',
            'Cursors.Hand',
            'SetZoomPercent(143)',
            'panning changed page/history/cache state',
            'preview did not follow page-down after panning',
            'PreviewCacheCapacity = 7',
            'SchedulePreviewPrefetch',
            'atomic preview swap',
            'DocumentWorkspace',
            'DocumentProcessingState',
            'TỆP ĐANG XỬ LÝ',
            'Trạng thái',
            'Chưa xử lý',
            'Đang xử lý',
            'Đã hoàn thành',
            'Lên 1',
            'Xuống 1',
            'Lên đầu',
            'Xuống cuối',
            'CHỈNH ĐƯỜNG CẮT',
            'ApplyManualCut',
            'TrackBar _zoom',
            'RunWorkflowSmoke'
          )
          foreach($m in $required) { if(-not $src.Contains($m)) { throw "Missing v2.6.1 protected marker: $m" } }
          if($src.Contains('ShowImmediatePreviewFromThumbnail')) { throw 'Regression: tiny-thumbnail preview path returned.' }
          if($src.Contains('Task.Delay(70, token)')) { throw 'Regression: obsolete preview debounce returned.' }
          if($src.Contains('_cut.Enabled = !busy && !_isSplit')) { throw 'Regression: manual cut disabled after split.' }

          $panStart = $src.IndexOf('private void PreviewPanMouseMove')
          $panEnd = $src.IndexOf('private void PreviewPanMouseUp', $panStart)
          if($panStart -lt 0 -or $panEnd -lt 0) { throw 'Pan method boundary missing.' }
          $panSlice = $src.Substring($panStart, $panEnd - $panStart)
          foreach($forbidden in @('RenderPreviewBitmap','LoadSelectedPreviewAsync','SetPreview(','PushHistory(','MarkActiveDocument','_previewCache','SelectedIndex =')) {
            if($panSlice.Contains($forbidden)) { throw "Pan isolation regression: $forbidden found in mouse-move path." }
          }

          $exe = Resolve-Path 'release-v2.6.1/Tach_Xep_Trang_PDF_v2.6.1_PORTABLE.exe'
          Write-Host 'RUN_SMOKE --ui-smoke (pan + page navigation + multi-PDF + cut + zoom)'
          $p = Start-Process -FilePath $exe -ArgumentList '--ui-smoke' -PassThru
          if(-not $p.WaitForExit(180000)) { try { $p.Kill() } catch {}; throw 'UI/workflow smoke timed out.' }
          if($p.ExitCode -ne 0) {
            Get-ChildItem "$env:LOCALAPPDATA/TachXepTrangPDF/Logs" -Filter '*.log' -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 10 | ForEach-Object { Write-Host "LOG=$($_.FullName)"; Get-Content $_.FullName }
            throw "UI/workflow smoke failed: exit=$($p.ExitCode)"
          }
          $logs = Get-ChildItem "$env:LOCALAPPDATA/TachXepTrangPDF/Logs" -Filter '*.log' -ErrorAction Stop | Sort-Object LastWriteTime -Descending
          $logText = ($logs | Select-Object -First 10 | ForEach-Object { Get-Content $_.FullName -Raw }) -join "`n"
          if($logText -notmatch 'WORKFLOW_SMOKE.*PASS') { throw 'WORKFLOW_SMOKE PASS marker missing.' }
          if($logText -notmatch 'UI_SMOKE.*PASS') { throw 'UI_SMOKE PASS marker missing.' }

          $exeHash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $verify = @(
            'TACH_XEP_TRANG_PDF_v2.6.1_FINAL_VERIFICATION',
            'BUILD=PASS',
            'SOURCE_CONTRACT=PASS',
            'UI_SMOKE=PASS',
            'WORKFLOW_SMOKE=PASS',
            'PREVIEW_DRAG_PAN=PASS',
            'PAN_ONLY_CHANGES_VIEWPORT=PASS',
            'PAN_DOES_NOT_RENDER=PASS',
            'PAN_DOES_NOT_CHANGE_SELECTION=PASS',
            'PAN_DOES_NOT_CHANGE_HISTORY=PASS',
            'PAN_DOES_NOT_CHANGE_FILE_STATUS=PASS',
            'PAGE_DOWN_AFTER_PAN=PASS',
            'PAGE_UP_AFTER_PAN=PASS',
            'NO_TINY_THUMBNAIL_PREVIEW=PASS',
            'REAL_PAGE_CACHE_PREFETCH=PASS',
            'MULTI_FILE_STATE_ISOLATION=PASS',
            'FILE_PROCESSING_STATUS=PASS',
            'MANUAL_CUT_AFTER_SPLIT=PASS',
            'FOUR_NAV_BUTTONS=PASS',
            'FIT_WINDOW_RESETS_PAN=PASS',
            'OFFLINE_FIRST_RUN_SELFTEST_AI=PASS (verified in build stage)',
            "EXE_SHA256=$exeHash"
          )
          $verify | Set-Content 'release-v2.6.1/FINAL-VERIFICATION-v2.6.1.txt' -Encoding UTF8
          Write-Host ($verify -join "`n")

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tach-Xep-Trang-PDF-v2.6.1-FINAL-PreviewPan-Offline-Release
          path: release-v2.6.1/*
          if-no-files-found: error
          retention-days: 30
