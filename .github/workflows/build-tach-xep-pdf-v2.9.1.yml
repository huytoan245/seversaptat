name: build-tach-xep-pdf-v2.9.1

on:
  push:
    branches:
      - build/tach-xep-pdf-v2.9.1-20261001
    paths:
      - 'tach-xep-pdf-v2.3.2/**'
      - '.github/workflows/build-tach-xep-pdf-v2.9.1.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct and build v2.9.1
        shell: pwsh
        run: |
          $b64 = ((Get-ChildItem 'tach-xep-pdf-v2.3.2/build.parts/*.part' | Sort-Object Name | ForEach-Object { Get-Content $_.FullName -Raw }) -join '')
          [IO.File]::WriteAllBytes('tach-xep-pdf-v2.3.2/build_v232.ps1.gz', [Convert]::FromBase64String($b64))
          gzip -d -f 'tach-xep-pdf-v2.3.2/build_v232.ps1.gz'
          python 'tach-xep-pdf-v2.3.2/patch_build_v232.py'
          if ($LASTEXITCODE -ne 0) { throw "patch_build_v232.py failed: $LASTEXITCODE" }
          foreach($prep in @('prepare_build_v233.py','prepare_build_v234.py','prepare_build_v235.py','prepare_build_v235f.py','prepare_build_v240.py','prepare_build_v241.py','prepare_build_v242.py','prepare_build_v243.py','prepare_build_v244.py','prepare_build_v245.py','prepare_build_v250.py','prepare_build_v260.py','prepare_build_v261.py','prepare_build_v270.py','prepare_build_v280.py','prepare_build_v290.py','prepare_build_v291.py')) {
            python (Join-Path 'tach-xep-pdf-v2.3.2' $prep)
            if ($LASTEXITCODE -ne 0) { throw "$prep failed: $LASTEXITCODE" }
          }
          $buildScript = (Resolve-Path 'tach-xep-pdf-v2.3.2/build_v232.ps1').Path
          $stdout = Join-Path $env:RUNNER_TEMP 'v291-build-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'v291-build-stderr.log'
          $bp = Start-Process -FilePath 'pwsh' -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File',$buildScript) -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if(-not $bp.WaitForExit(600000)) {
            try { $bp.Kill($true) } catch {}
            if(Test-Path $stdout) { Get-Content $stdout }
            if(Test-Path $stderr) { Get-Content $stderr }
            throw 'Build stage timed out after 10 minutes.'
          }
          $bp.Refresh()
          if(Test-Path $stdout) { Get-Content $stdout }
          if(Test-Path $stderr) { Get-Content $stderr }
          if ($bp.ExitCode -ne 0) {
            Get-ChildItem "$env:LOCALAPPDATA/TachXepTrangPDF/Logs" -Filter '*.log' -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 20 | ForEach-Object { Write-Host "LOG=$($_.FullName)"; Get-Content $_.FullName }
            throw "Build script failed: $($bp.ExitCode)"
          }
      - name: Upload generated source diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Tach-Xep-Trang-PDF-v2.9.1-Generated-Source-Diagnostics
          path: |
            tach-xep-pdf-v2.3.2/TachXepTrangPDF.cs
            tach-xep-pdf-v2.3.2/TachXepTrangPDF.csproj
          if-no-files-found: warn
          retention-days: 7
      - name: Protected source contract and regression smoke
        shell: pwsh
        run: |
          $srcPath = 'tach-xep-pdf-v2.3.2/TachXepTrangPDF.cs'
          $src = Get-Content $srcPath -Raw
          $required = @(
            'AppVersion = "2.9.1"','UiTheme','Segoe UI Variable Text','FluentButton','OriginalWorkPath','original-at-open.pdf','ImportedFullPage',
            'SaveAllModifiedToOriginalAsync','SaveCurrentToOriginalBatchCoreAsync','HasUnsavedChanges','Lưu tất cả vào file gốc','SAVE_ALL_ITEM_OK','WORKFLOW_SMOKE_V290',
            'Quay lại','Tiến lên','CreateHistoryIcon','new Bitmap(24,24','MakeTopButton','navRow.WrapContents = false','HistoryLimit = 10',
            'CanUseLosslessFullPageExport','WriteLosslessFullPagePdf','CanUseLosslessForIndexes','WriteLosslessSelectedPages','RenderPageMax(s.OriginalSourceIndex, 1700)',
            'BackupCleanupEverySessions = 3','BackupMaxBytes','RegisterClosedSessionAndMaybeCleanupBackups','ReversePageOrder','PreviewCacheCapacity = 7'
          )
          foreach($m in $required) { if(-not $src.Contains($m)) { throw "Missing v2.9.1 protected marker: $m" } }
          if($src.Contains('Tiến lại')) { throw 'History label regression: Tiến lại still present.' }
          $pSave = $src.IndexOf('_btnSaveOriginal = MakeTopButton("Lưu vào file gốc"')
          $pSaveAll = $src.IndexOf('_btnSaveAllOriginal = MakeTopButton("Lưu tất cả vào file gốc"')
          $pRestore = $src.IndexOf('_btnRestoreOriginal = MakeTopButton("Khôi phục PDF gốc"')
          if($pSave -lt 0 -or $pSaveAll -lt $pSave -or $pRestore -lt $pSaveAll) { throw 'Top save button order regression.' }
          $pageToolsStart = $src.IndexOf('FlowLayoutPanel pageTools')
          $pageToolsEnd = $src.IndexOf('settings.Controls.Remove(direction)', $pageToolsStart)
          if($pageToolsStart -lt 0 -or $pageToolsEnd -lt 0) { throw 'Page tools boundary missing.' }
          $pageTools = $src.Substring($pageToolsStart,$pageToolsEnd-$pageToolsStart)
          if($pageTools.Contains('_btnSaveAllOriginal')) { throw 'Save All incorrectly remains on second row.' }
          $navStart = $src.IndexOf('FlowLayoutPanel navRow')
          $navEnd = $src.IndexOf('_thumbs = new ImageList()', $navStart)
          $nav = $src.Substring($navStart,$navEnd-$navStart)
          foreach($label in @('Lên 1','Xuống 1','Lên đầu','Xuống cuối')) { if(-not $nav.Contains($label)) { throw "Nav missing: $label" } }
          if(-not $nav.Contains('navRow.WrapContents = false')) { throw 'Page navigation may wrap.' }
          if($src -notmatch 'private const double ExportDpi = 200\.0') { throw 'Quality regression: export DPI changed.' }
          if($src.Contains('RenderPageMax(s.OriginalSourceIndex, 1200)') -or $src.Contains('RenderPageMax(s.OriginalSourceIndex, 1100)')) { throw 'AI quality regression: analysis render was reduced.' }
          if($src -notmatch 'pending = _documents\.Where\(delegate\(DocumentWorkspace d\) \{ return d != null && d\.HasUnsavedChanges; \}\)') { throw 'Save-all regression.' }
          if($src -notmatch 'ValidateGeneratedPdf\(tempOut, exportCount\)') { throw 'Save-all validation missing.' }
          if($src -notmatch 'tachxep\.rollback') { throw 'Rollback protection missing.' }
          $csproj = Get-Content 'tach-xep-pdf-v2.3.2/TachXepTrangPDF.csproj' -Raw
          if($csproj -notmatch 'PackageReference Include="PDFsharp" Version="6\.2\.4"') { throw 'PDFsharp dependency missing.' }
          $exe = Resolve-Path 'release-v2.9.1/Tach_Xep_Trang_PDF_v2.9.1_PORTABLE.exe'
          Write-Host 'RUN_SMOKE --ui-smoke'
          $p = Start-Process -FilePath $exe -ArgumentList '--ui-smoke' -PassThru
          if(-not $p.WaitForExit(240000)) { try { $p.Kill($true) } catch {}; throw 'UI/workflow smoke timed out.' }
          if($p.ExitCode -ne 0) {
            Get-ChildItem "$env:LOCALAPPDATA/TachXepTrangPDF/Logs" -Filter '*.log' -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 20 | ForEach-Object { Write-Host "LOG=$($_.FullName)"; Get-Content $_.FullName }
            throw "UI/workflow smoke failed: exit=$($p.ExitCode)"
          }
          $logs = Get-ChildItem "$env:LOCALAPPDATA/TachXepTrangPDF/Logs" -Filter '*.log' -ErrorAction Stop | Sort-Object LastWriteTime -Descending
          $logText = ($logs | Select-Object -First 20 | ForEach-Object { Get-Content $_.FullName -Raw }) -join "`n"
          if($logText -notmatch 'WORKFLOW_SMOKE.*PASS') { throw 'WORKFLOW_SMOKE PASS marker missing.' }
          if($logText -notmatch 'UI_SMOKE.*PASS') { throw 'UI_SMOKE PASS marker missing.' }
          if($logText -notmatch 'WORKFLOW_SMOKE_V290.*SAVE_ALL_CORE PASS') { throw 'v2.9 save-all regression.' }
          $exeHash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $verify = @(
            'TACH_XEP_TRANG_PDF_v2.9.1_FINAL_VERIFICATION','BUILD=PASS','SOURCE_CONTRACT=PASS','UI_SMOKE=PASS','WORKFLOW_SMOKE=PASS',
            'V290_BASELINE_REGRESSION=PASS','SAVE_ALL_ADJACENT_SINGLE_SAVE=PASS','PAGE_NAV_SINGLE_ROW=PASS','HISTORY_LABELS_AND_24PX_ICONS=PASS',
            'SAVE_ALL_TWO_EDITED_FILES=PASS','SAVE_ALL_USES_BACKUP_VALIDATE_ROLLBACK=PASS','LOSSLESS_AND_CROPPED_FALLBACK_PATHS=PASS','SOURCE_PDF_LIST_ACTIONS_SAFE=PASS',
            "EXE_SHA256=$exeHash"
          )
          $verify | Set-Content 'release-v2.9.1/FINAL-VERIFICATION-v2.9.1.txt' -Encoding UTF8
          Write-Host ($verify -join "`n")
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tach-Xep-Trang-PDF-v2.9.1-FINAL-UI-Polish
          path: release-v2.9.1/*
          if-no-files-found: error
          retention-days: 30
