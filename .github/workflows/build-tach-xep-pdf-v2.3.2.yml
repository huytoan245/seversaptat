name: build-tach-xep-pdf-v2.3.2

on:
  push:
    branches:
      - build/tach-xep-pdf-v2.3.2-20260905
    paths:
      - 'tach-xep-pdf-v2.3.2/**'
      - '.github/workflows/build-tach-xep-pdf-v2.3.2.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reconstruct and run true-offline build
        shell: pwsh
        run: |
          $b64 = ((Get-ChildItem 'tach-xep-pdf-v2.3.2/build.parts/*.part' | Sort-Object Name | ForEach-Object { Get-Content $_.FullName -Raw }) -join '')
          [IO.File]::WriteAllBytes('tach-xep-pdf-v2.3.2/build_v232.ps1.gz', [Convert]::FromBase64String($b64))
          gzip -d -f 'tach-xep-pdf-v2.3.2/build_v232.ps1.gz'
          & pwsh -NoProfile -ExecutionPolicy Bypass -File 'tach-xep-pdf-v2.3.2/build_v232.ps1'
          if ($LASTEXITCODE -ne 0) { throw "Build script failed: $LASTEXITCODE" }

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tach-Xep-Trang-PDF-v2.3.2-True-Offline-Release
          path: release-v2.3.2/*
          if-no-files-found: error
          retention-days: 30
