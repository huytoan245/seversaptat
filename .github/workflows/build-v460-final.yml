      - name: Validate final EXE first-run and cached-run
        working-directory: tools/doi-ten-nen-pdf/wrapper460-final
        run: |
          $ErrorActionPreference='Stop'
          $exe=Join-Path $PWD 'Duoi-duoi-PDF-va-Nen-file-PDF-v4.6.0-SINGLE-EXE.exe'
          $cache=Join-Path $env:LOCALAPPDATA 'DuoiDuoiPDFNenFilePDF\v4.6.0'
          Remove-Item $cache -Recurse -Force -ErrorAction SilentlyContinue
          $p=Start-Process $exe -ArgumentList '--self-test' -Wait -PassThru
          if($p.ExitCode -ne 0){throw "first run self-test failed: $($p.ExitCode)"}
          if(-not (Get-ChildItem $cache -Recurse -File -Filter qpdf.exe -ErrorAction SilentlyContinue)){throw 'qpdf missing after first-run extraction'}
          if(-not (Get-ChildItem $cache -Recurse -File -Filter gswin64c.exe -ErrorAction SilentlyContinue)){throw 'Ghostscript missing after first-run extraction'}
          $p2=Start-Process $exe -ArgumentList '--self-test' -Wait -PassThru
          if($p2.ExitCode -ne 0){throw "cached-run self-test failed: $($p2.ExitCode)"}
          $sha=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$exe  $sha"|Set-Content CHECKSUM.txt -Encoding ascii
          Write-Host "FINAL_SHA256=$sha"
          Write-Host "FINAL_SIZE=$((Get-Item $exe).Length)"

