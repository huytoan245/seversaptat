name: Build v4.6.0 Three AUTO Modes

on:
  push:
    branches:
      - build/duoi-duoi-pdf-va-nen-file-pdf-v4.6.0-modes-20261007
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Patch v4.6.0 source safely
        working-directory: tools/doi-ten-nen-pdf
        run: |
          $ErrorActionPreference='Stop'
          & .\v450\patch-v450.ps1
          if($LASTEXITCODE -ne 0){throw 'v4.5 baseline patch failed'}
          & .\v460\patch-v460.ps1
          if($LASTEXITCODE -ne 0){throw 'v4.6 mode patch failed'}

      - name: Stage Ghostscript 10.08.0 offline engine
        working-directory: tools/doi-ten-nen-pdf
        run: |
          $ErrorActionPreference='Stop'
          $installer=Join-Path $env:RUNNER_TEMP 'gs10080w64.exe'
          Invoke-WebRequest -Uri 'https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10080/gs10080w64.exe' -OutFile $installer -UseBasicParsing
          $expected='52a91b8bf09298788d7a57b9206127026c23eacd75405f0a131e26dc381dce50'
          $actual=(Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne $expected){throw "Ghostscript checksum mismatch: $actual"}
          $extract=Join-Path $env:RUNNER_TEMP 'gs-v460-final'
          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $extract|Out-Null
          $seven=(Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if(-not $seven){$seven='C:\Program Files\7-Zip\7z.exe'}
          & $seven x $installer "-o$extract" -y | Out-Null
          if($LASTEXITCODE -ne 0){throw 'Ghostscript extraction failed'}
          $gs=Get-ChildItem $extract -Recurse -File -Filter gswin64c.exe|Select-Object -First 1
          if(-not $gs){throw 'gswin64c.exe missing'}
          $root=Split-Path (Split-Path $gs.FullName -Parent) -Parent
          $engine=Join-Path $PWD 'payload\engine\ghostscript-10.08.0'
          New-Item -ItemType Directory -Force $engine|Out-Null
          Copy-Item (Join-Path $root '*') $engine -Recurse -Force
          $bundled=Get-ChildItem $engine -Recurse -File -Filter gswin64c.exe|Select-Object -First 1
          & $bundled.FullName --version
          if($LASTEXITCODE -ne 0){throw 'bundled Ghostscript cannot start'}

      - name: Stage qpdf 12.4.1 offline page engine
        working-directory: tools/doi-ten-nen-pdf
        run: |
          $ErrorActionPreference='Stop'
          $zip=Join-Path $env:RUNNER_TEMP 'qpdf-12.4.1-msvc64.zip'
          Invoke-WebRequest -Uri 'https://github.com/qpdf/qpdf/releases/download/v12.4.1/qpdf-12.4.1-msvc64.zip' -OutFile $zip -UseBasicParsing
          $expected='3cd016cd433ef7232e42f4c13348a49cc14907a3c7278ef4f99120593126f7a6'
          $actual=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne $expected){throw "qpdf checksum mismatch: $actual"}
          $extract=Join-Path $env:RUNNER_TEMP 'qpdf-v460-final'
          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          $qpdf=Get-ChildItem $extract -Recurse -File -Filter qpdf.exe|Select-Object -First 1
          if(-not $qpdf){throw 'qpdf.exe missing'}
          $root=Split-Path (Split-Path $qpdf.FullName -Parent) -Parent
          $engine=Join-Path $PWD 'payload\engine\qpdf-12.4.1'
          New-Item -ItemType Directory -Force $engine|Out-Null
          Copy-Item (Join-Path $root '*') $engine -Recurse -Force
          $bundled=Get-ChildItem $engine -Recurse -File -Filter qpdf.exe|Select-Object -First 1
          & $bundled.FullName --version
          if($LASTEXITCODE -ne 0){throw 'bundled qpdf cannot start'}

      - name: Build Windows core
        working-directory: tools/doi-ten-nen-pdf
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName System.Drawing
          $bmp=[Drawing.Bitmap]::new(256,256)
          $g=[Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode=[Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $g.Clear([Drawing.Color]::Transparent)
          $g.FillEllipse([Drawing.SolidBrush]::new([Drawing.Color]::FromArgb(24,46,76)),8,8,240,240)
          $g.FillRectangle([Drawing.SolidBrush]::new([Drawing.Color]::FromArgb(250,250,252)),54,34,148,178)
          $g.FillRectangle([Drawing.SolidBrush]::new([Drawing.Color]::FromArgb(226,53,64)),38,96,180,62)
          $font=[Drawing.Font]::new('Segoe UI',32,[Drawing.FontStyle]::Bold,[Drawing.GraphicsUnit]::Pixel)
          $sf=[Drawing.StringFormat]::new();$sf.Alignment='Center';$sf.LineAlignment='Center'
          $g.DrawString('PDF',$font,[Drawing.SolidBrush]::new([Drawing.Color]::White),[Drawing.RectangleF]::new(38,96,180,62),$sf)
          $pen=[Drawing.Pen]::new([Drawing.Color]::FromArgb(55,190,220),10);$pen.StartCap='Round';$pen.EndCap='Round'
          $g.DrawArc($pen,82,166,92,54,8,164);$g.DrawLine($pen,91,198,112,218);$g.DrawLine($pen,91,198,118,196)
          $png=Join-Path $PWD 'app-icon-v460.png';$bmp.Save($png,[Drawing.Imaging.ImageFormat]::Png);$g.Dispose();$bmp.Dispose()
          $pb=[IO.File]::ReadAllBytes($png);$ico=Join-Path $PWD 'app.ico';$fs=[IO.File]::Create($ico);$bw=[IO.BinaryWriter]::new($fs)
          $bw.Write([UInt16]0);$bw.Write([UInt16]1);$bw.Write([UInt16]1);$bw.Write([Byte]0);$bw.Write([Byte]0);$bw.Write([Byte]0);$bw.Write([Byte]0);$bw.Write([UInt16]1);$bw.Write([UInt16]32);$bw.Write([UInt32]$pb.Length);$bw.Write([UInt32]22);$bw.Write([byte[]]$pb);$bw.Dispose();$fs.Dispose()
          @'
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0">
            <assemblyIdentity version="4.5.0.0" processorArchitecture="amd64" name="NguyenHuyToan.DuoiDuoiPDFNenFilePDF" type="win32"/>
            <description>Đuổi đuôi PDF và Nén file PDF v4.6.0</description>
            <dependency><dependentAssembly><assemblyIdentity type="win32" name="Microsoft.Windows.Common-Controls" version="6.0.0.0" processorArchitecture="*" publicKeyToken="6595b64144ccf1df" language="*"/></dependentAssembly></dependency>
            <application xmlns="urn:schemas-microsoft-com:asm.v3"><windowsSettings><dpiAware xmlns="http://schemas.microsoft.com/SMI/2005/WindowsSettings">true/pm</dpiAware><dpiAwareness xmlns="http://schemas.microsoft.com/SMI/2016/WindowsSettings">PerMonitorV2</dpiAwareness><longPathAware xmlns="http://schemas.microsoft.com/SMI/2016/WindowsSettings">true</longPathAware></windowsSettings></application>
          </assembly>
          '@|Set-Content app.manifest -Encoding utf8
          go install github.com/akavel/rsrc@v0.10.2
          $rsrc=Join-Path (go env GOPATH) 'bin\rsrc.exe'
          & $rsrc -ico app.ico -manifest app.manifest -o rsrc_windows_amd64.syso
          if($LASTEXITCODE -ne 0){throw 'rsrc failed'}
          go vet ./...
          if($LASTEXITCODE -ne 0){throw 'go vet failed'}
          $core=Join-Path $PWD 'payload\Duoi-duoi-PDF-va-Nen-file-PDF-core.exe'
          go build -trimpath -ldflags='-s -w -H=windowsgui' -o $core .
          if($LASTEXITCODE -ne 0){throw 'core build failed'}

      - name: Regression test three AUTO modes, quality and preserved behavior
        working-directory: tools/doi-ten-nen-pdf
        run: |
          $ErrorActionPreference='Stop'
          @'
          package main

          import (
              "bytes"
              "context"
              "fmt"
              "os"
              "path/filepath"
              "strings"
              "testing"
          )

          func testBin460(t *testing.T, name string) string {
              t.Helper()
              var found string
              _ = filepath.WalkDir(filepath.Join("payload", "engine"), func(path string, d os.DirEntry, err error) error {
                  if err == nil && !d.IsDir() && strings.EqualFold(d.Name(), name) {
                      found = path
                      return filepath.SkipAll
                  }
                  return nil
              })
              if found == "" { t.Fatalf("%s missing", name) }
              return found
          }

          func blankPDF460(path string) error {
              var b bytes.Buffer
              b.WriteString("%PDF-1.4\n")
              offsets:=make([]int,5)
              obj:=func(n int,s string){offsets[n]=b.Len();fmt.Fprintf(&b,"%d 0 obj\n%s\nendobj\n",n,s)}
              obj(1,"<< /Type /Catalog /Pages 2 0 R >>")
              obj(2,"<< /Type /Pages /Kids [3 0 R] /Count 1 >>")
              obj(3,"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Contents 4 0 R >>")
              obj(4,"<< /Length 0 >>\nstream\n\nendstream")
              xr:=b.Len();b.WriteString("xref\n0 5\n0000000000 65535 f \n");for i:=1;i<=4;i++{fmt.Fprintf(&b,"%010d 00000 n \n",offsets[i])};fmt.Fprintf(&b,"trailer\n<< /Size 5 /Root 1 0 R >>\nstartxref\n%d\n%%%%EOF\n",xr)
              return os.WriteFile(path,b.Bytes(),0644)
          }

          func scanLikeImagePDF460(path string, w, h int) error {
              var b bytes.Buffer
              b.WriteString("%PDF-1.4\n")
              offsets:=make([]int,6)
              obj:=func(n int,fn func()){offsets[n]=b.Len();fmt.Fprintf(&b,"%d 0 obj\n",n);fn();b.WriteString("\nendobj\n")}
              obj(1,func(){b.WriteString("<< /Type /Catalog /Pages 2 0 R >>")})
              obj(2,func(){b.WriteString("<< /Type /Pages /Kids [3 0 R] /Count 1 >>")})
              obj(3,func(){b.WriteString("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>")})
              rawLen:=w*h*3;offsets[4]=b.Len();fmt.Fprintf(&b,"4 0 obj\n<< /Type /XObject /Subtype /Image /Width %d /Height %d /ColorSpace /DeviceRGB /BitsPerComponent 8 /Length %d >>\nstream\n",w,h,rawLen)
              row:=make([]byte,w*3);var seed uint32=1
              for y:=0;y<h;y++{
                  for px:=0;px<w;px++{
                      seed=seed*1664525+1013904223
                      noise:=int((seed>>28)&7)
                      r,g,bl:=245-noise,245-noise,245-noise
                      if y%44<3 && px>70 && px<w-70 { r,g,bl=45+noise,45+noise,45+noise }
                      if px>w*2/3 && y>h/5 && y<h*4/5 { r,g,bl=150+noise,150+noise,150+noise }
                      if px>w/4 && px<w/2 && y>h/3 && y<h*2/3 && (px+y)%19<2 { r,g,bl=180,65,65 }
                      off:=px*3;row[off]=byte(r);row[off+1]=byte(g);row[off+2]=byte(bl)
                  }
                  b.Write(row)
              }
              b.WriteString("\nendstream\nendobj\n")
              content:="q 612 0 0 792 0 0 cm /Im0 Do Q\n"
              obj(5,func(){fmt.Fprintf(&b,"<< /Length %d >>\nstream\n%sendstream",len(content),content)})
              xr:=b.Len();b.WriteString("xref\n0 6\n0000000000 65535 f \n");for i:=1;i<=5;i++{fmt.Fprintf(&b,"%010d 00000 n \n",offsets[i])};fmt.Fprintf(&b,"trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n%d\n%%%%EOF\n",xr)
              return os.WriteFile(path,b.Bytes(),0644)
          }

          func largeUnusedPDF460(path string, payload int) error {
              var b bytes.Buffer
              b.WriteString("%PDF-1.4\n")
              offsets:=make([]int,6)
              obj:=func(n int,s string){offsets[n]=b.Len();fmt.Fprintf(&b,"%d 0 obj\n%s\nendobj\n",n,s)}
              obj(1,"<< /Type /Catalog /Pages 2 0 R >>")
              obj(2,"<< /Type /Pages /Kids [3 0 R] /Count 1 >>")
              obj(3,"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Contents 4 0 R >>")
              obj(4,"<< /Length 0 >>\nstream\n\nendstream")
              offsets[5]=b.Len();fmt.Fprintf(&b,"5 0 obj\n<< /Length %d >>\nstream\n",payload)
              chunk:=bytes.Repeat([]byte("A"),64*1024);left:=payload
              for left>0{n:=len(chunk);if n>left{n=left};b.Write(chunk[:n]);left-=n}
              b.WriteString("\nendstream\nendobj\n")
              xr:=b.Len();b.WriteString("xref\n0 6\n0000000000 65535 f \n");for i:=1;i<=5;i++{fmt.Fprintf(&b,"%010d 00000 n \n",offsets[i])};fmt.Fprintf(&b,"trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n%d\n%%%%EOF\n",xr)
              return os.WriteFile(path,b.Bytes(),0644)
          }

          func splitMax460(t *testing.T, ctx context.Context, qpdf, pdf string) int64 {
              t.Helper();d:=t.TempDir();pages,err:=splitPDFPages460(ctx,qpdf,pdf,d);if err!=nil{t.Fatal(err)}
              var max int64
              for _,p:=range pages{fi,err:=os.Stat(p);if err!=nil{t.Fatal(err)};if fi.Size()>max{max=fi.Size()}}
              return max
          }

          func TestPolicies460(t *testing.T){
              p1:=autoPolicyForMode460(1);p2:=autoPolicyForMode460(2);p3:=autoPolicyForMode460(3)
              if p1.FileLimit!=20_000_000||p1.PageLimit!=1_000_000{t.Fatalf("mode1 wrong: %+v",p1)}
              if p2.FileLimit!=30_000_000||p2.PageLimit!=1_000_000{t.Fatalf("mode2 wrong: %+v",p2)}
              if p3.FileLimit!=20_000_000||p3.PageLimit!=500_000{t.Fatalf("mode3 wrong: %+v",p3)}
          }

          func TestMode1VsMode2FileThreshold460(t *testing.T){
              ctx:=context.Background();gs:=testBin460(t,"gswin64c.exe");qpdf:=testBin460(t,"qpdf.exe");d:=t.TempDir()
              p1:=filepath.Join(d,"mode1.pdf");p2:=filepath.Join(d,"mode2.pdf")
              if err:=largeUnusedPDF460(p1,25_000_000);err!=nil{t.Fatal(err)}
              b,err:=os.ReadFile(p1);if err!=nil{t.Fatal(err)};if err:=os.WriteFile(p2,b,0644);err!=nil{t.Fatal(err)}
              fi,_:=os.Stat(p1);if fi.Size()<=20_000_000||fi.Size()>=30_000_000{t.Fatalf("source not between 20/30MB: %d",fi.Size())}
              before2,_:=os.ReadFile(p2)
              r2:=compressAutoPageAware460(ctx,gs,qpdf,p2,autoPolicyForMode460(2))
              if r2.Err!=nil||r2.Replaced{t.Fatalf("mode2 must skip 20-30MB file with safe page: %+v",r2)}
              after2,_:=os.ReadFile(p2);if !bytes.Equal(before2,after2){t.Fatal("mode2 rewrote a file that should be skipped")}
              r1:=compressAutoPageAware460(ctx,gs,qpdf,p1,autoPolicyForMode460(1))
              if r1.Err!=nil||!r1.Replaced{t.Fatalf("mode1 must compress >=20MB file: %+v",r1)}
              out,_:=os.Stat(p1);if out.Size()>=20_000_000{t.Fatalf("mode1 output not <20MB: %d",out.Size())}
              if max:=splitMax460(t,ctx,qpdf,p1);max>=1_000_000{t.Fatalf("mode1 page not <1MB: %d",max)}
          }

          func TestMode3StrictPage460(t *testing.T){
              ctx:=context.Background();gs:=testBin460(t,"gswin64c.exe");qpdf:=testBin460(t,"qpdf.exe");d:=t.TempDir()
              p:=filepath.Join(d,"strict500.pdf")
              if err:=scanLikeImagePDF460(p,1800,1400);err!=nil{t.Fatal(err)}
              maxBefore:=splitMax460(t,ctx,qpdf,p);if maxBefore<500_000{t.Fatalf("test page not >=500KB: %d",maxBefore)}
              r:=compressAutoPageAware460(ctx,gs,qpdf,p,autoPolicyForMode460(3))
              if r.Err!=nil||!r.Replaced{t.Fatalf("mode3 failed: %+v",r)}
              if max:=splitMax460(t,ctx,qpdf,p);max>=500_000{t.Fatalf("mode3 page not <500KB: %d",max)}
              out,_:=os.Stat(p);if out.Size()>=20_000_000{t.Fatalf("mode3 file not <20MB: %d",out.Size())}
          }

          func TestAlreadySafeNotRewritten460(t *testing.T){
              ctx:=context.Background();gs:=testBin460(t,"gswin64c.exe");qpdf:=testBin460(t,"qpdf.exe");d:=t.TempDir();p:=filepath.Join(d,"safe.pdf")
              if err:=blankPDF460(p);err!=nil{t.Fatal(err)};before,_:=os.ReadFile(p)
              r:=compressAutoPageAware460(ctx,gs,qpdf,p,autoPolicyForMode460(1))
              if r.Err!=nil||r.Replaced{t.Fatalf("safe file should not be rewritten: %+v",r)}
              after,_:=os.ReadFile(p);if !bytes.Equal(before,after){t.Fatal("safe PDF bytes changed")}
          }

          func TestQualityAndSingleGeneration460(t *testing.T){
              if autoProfilesQuality460[0].dpi!=300||autoProfilesQuality460[0].quality!=98{t.Fatalf("quality mode must start 300/Q98: %+v",autoProfilesQuality460[0])}
              if autoProfilesStrict500460[0].dpi!=300||autoProfilesStrict500460[0].quality!=98{t.Fatalf("strict mode must start 300/Q98: %+v",autoProfilesStrict500460[0])}
              b,err:=os.ReadFile("v460/compression.go.txt");if err!=nil{t.Fatal(err)};s:=string(b)
              if !strings.Contains(s,"NEVER used as input to another Ghostscript pass"){t.Fatal("single-generation invariant missing")}
              if !strings.Contains(s,"runGhostscript(ctx, gs, original, trial"){t.Fatal("whole-file trials not rooted at original")}
              if !strings.Contains(s,"runGhostscript(ctx, gs, sourcePage, out"){t.Fatal("page trials not rooted at original page")}
          }

          func TestUIAndPerformanceArchitecture460(t *testing.T){
              b,err:=os.ReadFile("main.go");if err!=nil{t.Fatal(err)};s:=string(b)
              for _,token:=range []string{"ID_AUTO_MODE1","ID_AUTO_MODE2","ID_AUTO_MODE3","1. <20 MB/file • <1 MB/trang (MẶC ĐỊNH)","2. <30 MB/file • <1 MB/trang","3. <20 MB/file • <500 KB/trang","selectedAutoMode460","workerCount = 2","func compressAtDPI"}{
                  if !strings.Contains(s,token){t.Fatalf("missing UI/preservation token: %s",token)}
              }
              if !strings.Contains(s,"uintptr(ID_AUTO_MODE1), uintptr(ID_AUTO_MODE3), uintptr(ID_AUTO_MODE1)"){t.Fatal("mode 1 is not the default")}
          }
          '@|Set-Content auto460_test.go -Encoding utf8
          go test -run 'Test.*460' -v -timeout 20m
          if($LASTEXITCODE -ne 0){throw 'v4.6 regression test failed'}
          Remove-Item auto460_test.go -Force

          $p=Start-Process (Join-Path $PWD 'payload\Duoi-duoi-PDF-va-Nen-file-PDF-core.exe') -WorkingDirectory (Join-Path $PWD 'payload') -ArgumentList '--self-test' -Wait -PassThru
          if($p.ExitCode -ne 0){throw 'core self-test failed'}

      - name: Package single-file offline launcher
        working-directory: tools/doi-ten-nen-pdf
        run: |
          $ErrorActionPreference='Stop'
          $payload=Join-Path $PWD 'payload'
          @'
          ĐUỔI ĐUÔI PDF VÀ NÉN FILE PDF v4.6.0

          AUTO có 3 chế độ:
          1) MẶC ĐỊNH: file <20 MB và từng trang <1 MB.
          2) File <30 MB và từng trang <1 MB.
          3) File <20 MB và từng trang <500 KB.

          Chỉ file/trang vượt ngưỡng đã chọn mới được nén. App luôn thử từ chất lượng cao nhất và dừng ở kết quả đầu tiên đạt yêu cầu, không cố nén nhỏ hơn cần thiết. Nếu cùng một PDF vi phạm cả ngưỡng file và ngưỡng trang, mọi phương án đều xuất phát từ bản gốc; không lấy kết quả đã nén làm đầu vào để nén lần hai. AUTO dùng tối đa 2 worker để tăng tốc. Phần đổi đuôi PDF, chế độ thủ công, bảo vệ chữ ký số/mã hóa, kiểm tra số trang, ghi đè an toàn và chạy offline được giữ nguyên.
          '@|Set-Content (Join-Path $payload 'HUONG-DAN-v4.6.0.txt') -Encoding utf8

          $wrap=Join-Path $PWD 'wrapper460-final'
          Remove-Item $wrap -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $wrap|Out-Null
          $zip=Join-Path $wrap 'payload.zip'
          Compress-Archive -Path (Join-Path $payload '*') -DestinationPath $zip -CompressionLevel Optimal -Force
          Copy-Item app.ico $wrap
          Copy-Item app-icon-v460.png $wrap
          Set-Location $wrap
          @'
          package main

          import (
              "archive/zip"
              "bytes"
              "crypto/sha256"
              _ "embed"
              "encoding/hex"
              "errors"
              "fmt"
              "io"
              "os"
              "os/exec"
              "path/filepath"
              "strings"
          )

          //go:embed payload.zip
          var payload []byte

          const version = "v4.6.0"
          const core = "Duoi-duoi-PDF-va-Nen-file-PDF-core.exe"

          func hash() string { h:=sha256.Sum256(payload); return hex.EncodeToString(h[:]) }
          func root() string { b:=os.Getenv("LOCALAPPDATA"); if b=="" { b,_=os.UserCacheDir() }; return filepath.Join(b,"DuoiDuoiPDFNenFilePDF",version) }

          func valid(r string) bool {
              if _,e:=os.Stat(filepath.Join(r,core));e!=nil{return false}
              b,e:=os.ReadFile(filepath.Join(r,".payload.sha256"));if e!=nil||strings.TrimSpace(string(b))!=hash(){return false}
              gsFound:=false;qpdfFound:=false
              _=filepath.WalkDir(filepath.Join(r,"engine"),func(p string,d os.DirEntry,e error)error{
                  if e==nil&&!d.IsDir(){if strings.EqualFold(d.Name(),"gswin64c.exe"){gsFound=true};if strings.EqualFold(d.Name(),"qpdf.exe"){qpdfFound=true};if gsFound&&qpdfFound{return errors.New("done")}}
                  return nil
              })
              return gsFound&&qpdfFound
          }

          func unpack(r string) error {
              if valid(r){return nil}
              stage:=r+fmt.Sprintf(".stage-%d",os.Getpid());_ = os.RemoveAll(stage)
              if e:=os.MkdirAll(stage,0755);e!=nil{return e}
              zr,e:=zip.NewReader(bytes.NewReader(payload),int64(len(payload)));if e!=nil{return e}
              for _,f:=range zr.File{
                  clean:=filepath.Clean(f.Name);if clean==".."||filepath.IsAbs(clean)||strings.HasPrefix(clean,".."+string(os.PathSeparator)){return errors.New("unsafe payload path")}
                  dst:=filepath.Join(stage,clean);if f.FileInfo().IsDir(){if e:=os.MkdirAll(dst,0755);e!=nil{return e};continue}
                  if e:=os.MkdirAll(filepath.Dir(dst),0755);e!=nil{return e};rc,e:=f.Open();if e!=nil{return e};out,e:=os.Create(dst);if e!=nil{rc.Close();return e};_,copyErr:=io.Copy(out,rc);closeErr:=out.Close();rc.Close();if copyErr!=nil{return copyErr};if closeErr!=nil{return closeErr}
              }
              if e:=os.WriteFile(filepath.Join(stage,".payload.sha256"),[]byte(hash()),0644);e!=nil{return e}
              _=os.RemoveAll(r);return os.Rename(stage,r)
          }

          func main(){
              r:=root();if e:=unpack(r);e!=nil{os.Exit(11)}
              cmd:=exec.Command(filepath.Join(r,core),os.Args[1:]...);cmd.Dir=r
