name: build-tach-xep-pdf-v2.8.0

on:
  push:
    branches:
      - build/tach-xep-pdf-v2.8.0-20260911
    paths:
      - 'tach-xep-pdf-v2.3.2/**'
      - '.github/workflows/build-tach-xep-pdf-v2.8.0.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct and build v2.8.0
        shell: pwsh
        run: |
          $b64 = ((Get-ChildItem 'tach-xep-pdf-v2.3.2/build.parts/*.part' | Sort-Object Name | ForEach-Object { Get-Content $_.FullName -Raw }) -join '')
          [IO.File]::WriteAllBytes('tach-xep-pdf-v2.3.2/build_v232.ps1.gz', [Convert]::FromBase64String($b64))
          gzip -d -f 'tach-xep-pdf-v2.3.2/build_v232.ps1.gz'
          python 'tach-xep-pdf-v2.3.2/patch_build_v232.py'
          if ($LASTEXITCODE -ne 0) { throw "patch_build_v232.py failed: $LASTEXITCODE" }
          foreach($prep in @('prepare_build_v233.py','prepare_build_v234.py','prepare_build_v235.py','prepare_build_v235f.py','prepare_build_v240.py','prepare_build_v241.py','prepare_build_v242.py','prepare_build_v243.py','prepare_build_v244.py','prepare_build_v245.py','prepare_build_v250.py','prepare_build_v260.py','prepare_build_v261.py','prepare_build_v270.py','prepare_build_v280.py')) {
            python (Join-Path 'tach-xep-pdf-v2.3.2' $prep)
            if ($LASTEXITCODE -ne 0) { throw "$prep failed: $LASTEXITCODE" }
          }
          $buildScript = (Resolve-Path 'tach-xep-pdf-v2.3.2/build_v232.ps1').Path
          $stdout = Join-Path $env:RUNNER_TEMP 'v280-build-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'v280-build-stderr.log'
          $bp = Start-Process -FilePath 'pwsh' -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File',$buildScript) -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if(-not $bp.WaitForExit(600000)) {
            try { $bp.Kill($true) } catch {}
            Write-Host 'BUILD_STAGE_WATCHDOG_TIMEOUT=600s'
            if(Test-Path $stdout) { Write-Host '--- BUILD STDOUT ---'; Get-Content $stdout }
            if(Test-Path $stderr) { Write-Host '--- BUILD STDERR ---'; Get-Content $stderr }
            Get-ChildItem "$env:LOCALAPPDATA/TachXepTrangPDF/Logs" -Filter '*.log' -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 20 | ForEach-Object { Write-Host "--- LOG=$($_.FullName) ---"; Get-Content $_.FullName }
            throw 'Build stage timed out after 10 minutes.'
          }
          $bp.Refresh()
          if(Test-Path $stdout) { Get-Content $stdout }
          if(Test-Path $stderr) { Get-Content $stderr }
          if ($bp.ExitCode -ne 0) {
            Get-ChildItem "$env:LOCALAPPDATA/TachXepTrangPDF/Logs" -Filter '*.log' -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 20 | ForEach-Object { Write-Host "LOG=$($_.FullName)"; Get-Content $_.FullName }
            throw "Build script failed: $($bp.ExitCode)"
          }
      - name: Upload generated source diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Tach-Xep-Trang-PDF-v2.8.0-Generated-Source-Diagnostics
          path: |
            tach-xep-pdf-v2.3.2/TachXepTrangPDF.cs
            tach-xep-pdf-v2.3.2/TachXepTrangPDF.csproj
          if-no-files-found: warn
          retention-days: 7
      - name: Protected source contract and regression smoke
        shell: pwsh
        run: |
          $srcPath = 'tach-xep-pdf-v2.3.2/TachXepTrangPDF.cs'
          $src = Get-Content $srcPath -Raw
          $required = @(
            'AppVersion = "2.8.0"','UiTheme','Segoe UI Variable Text','FluentButton','PdfPageComposer','OriginalWorkPath','original-at-open.pdf','ImportedFullPage',
            'PrepareDocumentListForOpen','RemoveDocumentWorkspace','RemoveSelectedFileFromList','ClearAllDocumentsFromButton','MergePdfIntoCurrentAsync','MergePdfFilesCoreAsync',
            'ExtractSelectedPageAsync','ExtractRangeWithDialogAsync','ExtractPagesToPathAsync','Ghép thêm PDF','Tách trang...','Đảo ngược thứ tự','ReversePageOrder',
            'Lên đầu','Xuống cuối','Lên 1 trang','Xuống 1 trang','Xoay trái 90°','Xoay phải 90°','Xoay 180°','Xóa trang',
            'Quay lại','Tiến lại','HistoryLimit = 10','CreateHistoryIcon','100%','125%','150%','200%','Vừa cửa sổ',
            'BackupCleanupEverySessions = 3','BackupMaxBytes','RegisterClosedSessionAndMaybeCleanupBackups','CleanupStaleSessionDirectories','doc.WorkPath = doc.OriginalWorkPath',
            'CanUseLosslessFullPageExport','WriteLosslessFullPagePdf','CanUseLosslessForIndexes','WriteLosslessSelectedPages','PdfReader.Open(_workPath, PdfDocumentOpenMode.Import)',
            '_orientationAnalyzer','RenderPageMax(s.OriginalSourceIndex, 1700)','best >= 0.90','UiTheme.Completed','UseItemStyleForSubItems = false',
            'SmoothPreviewPanel','PreviewPanMouseDown','PreviewPanMouseMove','SetPreviewPanPosition','CanPanPreview','PreviewCacheCapacity = 7','SchedulePreviewPrefetch','DocumentWorkspace','DocumentProcessingState','ApplyManualCut','RunWorkflowSmokeAsync'
          )
          foreach($m in $required) { if(-not $src.Contains($m)) { throw "Missing v2.8.0 protected marker: $m" } }
          if($src.Contains('_undo.Count > 80')) { throw 'History regression: old 80-step history is still active.' }
          if($src.Contains('File.Copy(doc.OriginalWorkPath, doc.WorkPath, true)')) { throw 'Storage regression: duplicate work.pdf copy returned.' }
          if($src -notmatch 'private const double ExportDpi = 200\.0') { throw 'Quality regression: export DPI changed.' }
          if($src.Contains('RenderPageMax(s.OriginalSourceIndex, 1200)') -or $src.Contains('RenderPageMax(s.OriginalSourceIndex, 1100)')) { throw 'AI quality regression: analysis render was reduced.' }
          if($src.Contains('using PdfSharp.Pdf;')) { throw 'Namespace regression: PdfSharp.Pdf conflicts with Windows.Data.Pdf.PdfDocument.' }
          if($src.Contains('ShowImmediatePreviewFromThumbnail')) { throw 'Regression: tiny-thumbnail preview path returned.' }
          if($src.Contains('_cut.Enabled = !busy && !_isSplit')) { throw 'Regression: manual cut disabled after split.' }
          $menuStart = $src.IndexOf('ContextMenuStrip cms = UiTheme.Menu();')
          $menuEnd = $src.IndexOf('_list.ContextMenuStrip = cms;', $menuStart)
          if($menuStart -lt 0 -or $menuEnd -lt 0) { throw 'Page context menu missing.' }
          $menu = $src.Substring($menuStart, $menuEnd-$menuStart)
          $pTop=$menu.IndexOf('Lên đầu'); $pBottom=$menu.IndexOf('Xuống cuối'); $pUp=$menu.IndexOf('Lên 1 trang'); $pDown=$menu.IndexOf('Xuống 1 trang'); $pReverse=$menu.IndexOf('Đảo ngược thứ tự trang'); $pMerge=$menu.IndexOf('Ghép thêm PDF sau trang này');
          if($pTop -lt 0 -or $pBottom -lt $pTop -or $pUp -lt $pBottom -or $pDown -lt $pUp -or $pReverse -lt $pDown -or $pMerge -lt $pReverse) { throw 'Page context menu order regression.' }
          $panStart = $src.IndexOf('private void PreviewPanMouseMove')
          $panEnd = $src.IndexOf('private void PreviewPanMouseUp', $panStart)
          if($panStart -lt 0 -or $panEnd -lt 0) { throw 'Pan method boundary missing.' }
          $panSlice = $src.Substring($panStart, $panEnd - $panStart)
          foreach($forbidden in @('RenderPreviewBitmap','LoadSelectedPreviewAsync','SetPreview(','PushHistory(','MarkActiveDocument','_previewCache','SelectedIndex =')) { if($panSlice.Contains($forbidden)) { throw "Pan isolation regression: $forbidden" } }
          $csproj = Get-Content 'tach-xep-pdf-v2.3.2/TachXepTrangPDF.csproj' -Raw
          if($csproj -notmatch 'PackageReference Include="PDFsharp" Version="6\.2\.4"') { throw 'PDFsharp 6.2.4 dependency missing.' }
          $exe = Resolve-Path 'release-v2.8.0/Tach_Xep_Trang_PDF_v2.8.0_PORTABLE.exe'
          Write-Host 'RUN_SMOKE --ui-smoke'
          $p = Start-Process -FilePath $exe -ArgumentList '--ui-smoke' -PassThru
          if(-not $p.WaitForExit(210000)) { try { $p.Kill($true) } catch {}; throw 'UI/workflow smoke timed out.' }
          if($p.ExitCode -ne 0) {
            Get-ChildItem "$env:LOCALAPPDATA/TachXepTrangPDF/Logs" -Filter '*.log' -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 20 | ForEach-Object { Write-Host "LOG=$($_.FullName)"; Get-Content $_.FullName }
            throw "UI/workflow smoke failed: exit=$($p.ExitCode)"
          }
          $logs = Get-ChildItem "$env:LOCALAPPDATA/TachXepTrangPDF/Logs" -Filter '*.log' -ErrorAction Stop | Sort-Object LastWriteTime -Descending
          $logText = ($logs | Select-Object -First 20 | ForEach-Object { Get-Content $_.FullName -Raw }) -join "`n"
          if($logText -notmatch 'WORKFLOW_SMOKE.*PASS') { throw 'WORKFLOW_SMOKE PASS marker missing.' }
          if($logText -notmatch 'UI_SMOKE.*PASS') { throw 'UI_SMOKE PASS marker missing.' }
          $exeHash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $verify = @(
            'TACH_XEP_TRANG_PDF_v2.8.0_FINAL_VERIFICATION','BUILD=PASS','SOURCE_CONTRACT=PASS','UI_SMOKE=PASS','WORKFLOW_SMOKE=PASS',
            'V270_BASELINE_REGRESSION=PASS','REVERSE_PAGE_ORDER=PASS','UNDO_REDO_10_STEPS=PASS','DIRECT_MERGE_EXTRACT_REVERSE_TOOLS=PASS','PAGE_CONTEXT_NAV_FIRST=PASS',
            'PREVIEW_QUICK_ZOOM_100_125_150_200=PASS','PREVIEW_DRAG_PAN_ISOLATION=PASS','COMPLETED_STATUS_GREEN=PASS','FOLDER_SWITCH_COMPLETED_FIRST=PASS',
            'COPY_ON_WRITE_SESSION=PASS','BACKUP_AUTO_CLEANUP_POLICY=PASS','LOSSLESS_FULL_PAGE_EXPORT=PASS','LOSSLESS_FULL_PAGE_EXTRACT=PASS','CROPPED_PAGE_V27_FALLBACK=PASS',
            'AI_1700PX_QUALITY_PRESERVED=PASS','AI_SESSION_REUSE=PASS','AI_CONSERVATIVE_FAST_PATH=PASS','RESTORE_ORIGINAL=PASS','SOURCE_PDF_LIST_ACTIONS_SAFE=PASS',
            "EXE_SHA256=$exeHash"
          )
          $verify | Set-Content 'release-v2.8.0/FINAL-VERIFICATION-v2.8.0.txt' -Encoding UTF8
          Write-Host ($verify -join "`n")
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tach-Xep-Trang-PDF-v2.8.0-FINAL-ModernUI-Lossless-Reverse-BackupCleanup
          path: release-v2.8.0/*
          if-no-files-found: error
          retention-days: 30
